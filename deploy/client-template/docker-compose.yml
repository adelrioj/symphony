# One Symphony container for one project (one Linear project + one repo).
#
#   cp .env.example .env     # then edit LINEAR_API_KEY
#   docker compose up -d
#
# Upgrade:  docker compose pull && docker compose up -d
#
# This directory is mounted read-only at /config as a *directory*, not a single file:
# a single-file bind mount pins the inode, so an editor's rename-replace on the host stops
# propagating into the container and live reload of workflow.md dies.
# Note: every value in .env is passed into the container (env_file below) and .env itself is
# readable inside it at /config/.env. Symphony's agents run with approval_policy: never, so
# treat anything you put in .env as readable by those agents — keep it to keys this
# deployment needs.

services:
  symphony:
    image: ghcr.io/adelrioj/symphony:latest   # pin a version tag (e.g. :0.0.2) for production
    environment:
      LINEAR_API_KEY: ${LINEAR_API_KEY:?set LINEAR_API_KEY in .env}
    env_file:
      - path: .env          # every variable in .env reaches the container (e.g. a clone token)
        required: false     # optional so `docker compose config` works before you create .env
    restart: unless-stopped
    volumes:
      # host Codex login; must already exist as a *file* or Docker creates a directory there
      - ${HOME:?run docker compose from a shell where HOME is set}/.codex/auth.json:/root/.codex/auth.json:ro
      - .:/config:ro
      - workspaces:/workspaces
      - logs:/app/elixir/log
    # Symphony requires the acknowledgement flag below to run unattended.
    command:
      - /config/workflow.md
      - --i-understand-that-this-will-be-running-without-the-usual-guardrails
      - --port
      - "4000"
      - --logs-root
      - /app/elixir/log
    ports:
      # loopback only: the dashboard and JSON API have no authentication. For remote access put
      # an authenticated reverse proxy in front of it, or use an SSH tunnel.
      - "127.0.0.1:4000:4000"   # dashboard + JSON API -> http://localhost:4000

volumes:
  workspaces:
  logs:
