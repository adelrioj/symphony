# Run several Symphony projects, one container each. OrbStack-compatible: no platform pins
# (native arm64 on Apple Silicon), standard bridge networking, standard bind mounts.
#
#   export LINEAR_API_KEY=...
#   docker compose up --build          # or: orb start, then the same command
#
# Add a project: copy a service block, point it at a new workflows/<name>.md, give it a
# unique host port and its own named volumes.

x-symphony: &symphony
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: symphony:latest
  environment:
    LINEAR_API_KEY: ${LINEAR_API_KEY:?set LINEAR_API_KEY in your shell}
  restart: unless-stopped

services:
  project-a:
    <<: *symphony
    volumes:
      - ${HOME}/.codex/auth.json:/root/.codex/auth.json:ro   # Codex login, shared across projects
      - ./workflows/project-a.md:/workflow.md:ro
      - project-a-workspaces:/workspaces
      - project-a-logs:/app/elixir/log
    command: ["/workflow.md", "--port", "4000", "--logs-root", "/app/elixir/log"]
    ports:
      - "4000:4000"   # dashboard + JSON API -> http://localhost:4000

  project-b:
    <<: *symphony
    volumes:
      - ${HOME}/.codex/auth.json:/root/.codex/auth.json:ro
      - ./workflows/project-b.md:/workflow.md:ro
      - project-b-workspaces:/workspaces
      - project-b-logs:/app/elixir/log
    command: ["/workflow.md", "--port", "4000", "--logs-root", "/app/elixir/log"]
    ports:
      - "4001:4000"   # -> http://localhost:4001

volumes:
  project-a-workspaces:
  project-a-logs:
  project-b-workspaces:
  project-b-logs:
