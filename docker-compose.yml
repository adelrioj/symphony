# Local development only: one Symphony container built from source, running the sanitized
# example workflow. Client deployments do NOT belong here — each client owns a private repo
# seeded from deploy/client-template/, which pulls the published GHCR image.
#
#   export LINEAR_API_KEY=...
#   docker compose up --build          # or: orb start, then the same command
#
# The workflow is mounted as a directory, not a single file: a single-file bind mount pins
# the inode, so an editor's rename-replace on the host stops propagating and hot reload dies.

services:
  symphony-example:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: symphony:latest
    environment:
      LINEAR_API_KEY: ${LINEAR_API_KEY:?set LINEAR_API_KEY in your shell}
    restart: unless-stopped
    volumes:
      # Host Codex login, mounted as a DIRECTORY, not as auth.json directly. The CLI rewrites
      # auth.json on token refresh (tokens.refresh_token / last_refresh), and a single-file bind
      # pins the container to the inode that existed at start: after the next host refresh the
      # container reads a stale token forever while the dashboard still looks healthy.
      # Read-write so the container can refresh on its own; it shares one login with the host.
      - ${HOME:?run docker compose from a shell where HOME is set}/.codex:/root/.codex
      - ./workflows:/config:ro
      - example-workspaces:/workspaces
      - example-logs:/app/elixir/log
    # Symphony requires the acknowledgement flag below to run unattended.
    command:
      - /config/example.md
      - --i-understand-that-this-will-be-running-without-the-usual-guardrails
      - --port
      - "4000"
      # --logs-root is the directory Symphony creates `log/` *under*, not the log directory
      # itself: it writes <root>/log/symphony.log*. Passing the volume path here would nest them
      # at /app/elixir/log/log/, outside the mount below.
      - --logs-root
      - /app/elixir
    ports:
      # loopback only: the dashboard and JSON API have no authentication, and the container binds
      # all of its own interfaces (server.host in the workflow file). Keep exposure on the host.
      - "127.0.0.1:4000:4000"   # dashboard + JSON API -> http://localhost:4000

volumes:
  example-workspaces:
  example-logs:
