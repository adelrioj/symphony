# Local development only: one Symphony installation built from source, with the sanitized
# example imported as a lane. Client deployments do NOT belong here — each client owns a private repo
# seeded from deploy/client-template/, which pulls the published GHCR image.
#
#   export LINEAR_API_KEY=...
#   export SYMPHONY_OPERATOR_TOKEN="$(openssl rand -hex 32)"
#   docker compose build
#   docker compose run --rm symphony-example lanes import /config/example.md --slug example --data-root /data
#   docker compose up -d               # then log in at http://localhost:4000 and enable example
#
# Mount the import directory, not one file, so explicit future imports see files replaced by
# host editors. Files are not watched: save running lane changes through the UI or API.

services:
  symphony-example:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: symphony:latest
    environment:
      LINEAR_API_KEY: ${LINEAR_API_KEY:?set LINEAR_API_KEY in your shell}
      SYMPHONY_OPERATOR_TOKEN: ${SYMPHONY_OPERATOR_TOKEN:?set SYMPHONY_OPERATOR_TOKEN in your shell}
    restart: unless-stopped
    volumes:
      # Host Codex login, mounted as a DIRECTORY, not as auth.json directly. The CLI rewrites
      # auth.json on token refresh (tokens.refresh_token / last_refresh), and a single-file bind
      # pins the container to the inode that existed at start: after the next host refresh the
      # container reads a stale token forever while the dashboard still looks healthy.
      # Read-write so the container can refresh on its own; it shares one login with the host.
      - ${HOME:?run docker compose from a shell where HOME is set}/.codex:/root/.codex
      - ./workflows:/config:ro
      - example-workspaces:/workspaces
      - example-data:/data
    # Symphony requires the acknowledgement flag below to run unattended.
    command:
      - serve
      - --i-understand-that-this-will-be-running-without-the-usual-guardrails
      - --port
      - "4000"
      - --host
      - 0.0.0.0
      - --data-root
      - /data
    ports:
      # Authenticated UI/API; keep host publishing on loopback. For remote access use an SSH
      # tunnel or a TLS reverse proxy. --host binds the container interface Docker forwards to.
      - "127.0.0.1:4000:4000"   # dashboard + JSON API -> http://localhost:4000

volumes:
  example-workspaces:
  example-data:
